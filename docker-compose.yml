services:
  postgres:
    image: postgres:17
    container_name: shramasa-postgres
    environment:
      POSTGRES_DB: shramasa
      POSTGRES_USER: shramasa
      POSTGRES_PASSWORD: shramasa_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
